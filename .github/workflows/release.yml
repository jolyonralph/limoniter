# Makes the Windows installer on GitHub's own computers, and offers it for download.
#
# To release: change the version in Cargo.toml, then push a matching tag, such as v0.1.0. The installer then appears
# on the repository's Releases page. Running this by hand from the Actions tab builds it without releasing it.

name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Use the current Rust
        run: rustup update stable --no-self-update

      - name: Check the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path 'Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "The tag is $env:GITHUB_REF_NAME, but Cargo.toml says version $version." }

      - name: Run the tests
        run: cargo test --locked

      - name: Build the installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v5
        with:
          name: Limoniter-installer
          path: target/installer/Limoniter-Setup-*.exe
          if-no-files-found: error

      - name: Put it on the Releases page
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem 'target/installer/Limoniter-Setup-*.exe' | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $installer --title "Limoniter $env:GITHUB_REF_NAME" --generate-notes
