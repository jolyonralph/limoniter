# Builds Limoniter.app on a Mac and keeps it with the run, to download from the Actions tab and try.
# It isn't signed yet, so macOS asks before opening it the first time (Control-click it and choose Open).

name: macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Use the current Rust
        run: rustup update stable --no-self-update

      - name: Keep what's been built between runs
        uses: Swatinem/rust-cache@v2

      - name: Make the app
        run: sh packaging/macos/make-app.sh

      - name: Keep the app with this run
        uses: actions/upload-artifact@v7
        with:
          name: Limoniter-macOS
          path: target/macos/Limoniter-*-macOS.zip
          if-no-files-found: error
