[package]
name = "limoniter"
version = "0.14.4"
edition = "2024"
description = "A text and hex editor"
license = "Apache-2.0"
repository = "https://github.com/jolyonralph/limoniter"

[dependencies]
# The terminal panel: a pseudo-terminal (ConPTY on Windows) and a VT100 screen.
portable-pty = "0.9"
vt100 = "0.16"
# The Next's debug cable (DeZog's dezogif), without libudev, which only lists ports.
serialport = { version = "4", default-features = false }
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# x11 and wayland matter only on Linux: without wayland, a Wayland desktop (GNOME's and KDE's usual one) can't
# open the window.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard", "system_fonts", "x11", "wayland"] }
encoding_rs = "0.8"
memchr = "2.8.3"
miniz_oxide = "0.8"
delharc = "0.8"
xdms = "0.2"
png = "0.18"
# JPEG pictures, brought into the Amiga bitplane converter.
zune-jpeg = "0.5"
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
regex = "1.13.1"
rfd = "0.17.2"
rhai = "1"
roxmltree = "0.21"
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust = "0.4"
# SVG drawn for the preview; without the decoders for GIF, WebP and JPEG pictures inside one (PNG still works).
resvg = { version = "0.49", default-features = false, features = ["svgz", "text", "system-fonts", "memmap-fonts"] }
sha2 = "0.10"
ssh2 = "0.9"
# FTPS: TLS for FTP's connections, with the same ring cryptography and list of authorities that ureq already uses.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"
# On Linux, the Secret Service (GNOME Keyring, KWallet) over D-Bus, through zbus with no C library:
# it keeps passwords across restarts, and works inside a Flatpak, where the kernel keyring is closed off.
keyring = { version = "3", features = ["windows-native", "apple-native", "async-secret-service", "async-io", "crypto-rust"] }
similar = { version = "2", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "yaml-load"] }
cpal = "0.18"
# Sound files to play: MP3, WAV, FLAC, Ogg Vorbis and AIFF, decoded in Rust with no C library.
symphonia = { version = "0.6", default-features = false, features = ["mp1", "mp2", "mp3", "wav", "aiff", "pcm", "adpcm", "flac", "ogg", "vorbis", "id3v1", "id3v2"] }
rustzx-core = { version = "0.16", features = ["embedded-roms", "autoload", "precise-border", "sound", "ay"] }
# The sound effects designer: the AY's sound (as the built-in Spectrum makes it), and a Z80 to run the beeper's player.
aym = "0.16"
# tf!: format! whose words are translated.
limoniter-macros = { path = "macros" }
rustzx-z80 = "0.16"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-normalization = "0.1"
unicode_names2 = "1"
bzip2 = "0.6"
lzfse_rust = "0.2"
ureq = "3"
# x86 disassembly, from the 8086 to AVX-512 and beyond (Tools, Disassemble).
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "nasm", "instr_info", "encoder", "op_code_info"] }
yaxpeax-arm = { version = "0.5.0", default-features = false, features = ["std", "fmt"] }
yaxpeax-arch = { version = "0.3.3", default-features = false, features = ["std"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
winresource = "0.1.34"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"

[target."cfg(not(windows))".dependencies]
# libssh2 uses Windows' own cryptography there; elsewhere it brings its own OpenSSL rather than needing one installed.
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Console"] }

[lints.clippy]
# Shared state handed to worker threads reads more plainly spelt out where it's used than behind an alias.
type_complexity = "allow"
too_many_arguments = "allow"
enum_variant_names = "allow"

# rustzx-core with one addition: a hook on memory writes, for the debugger's watchpoints. MIT, as the original.
[patch.crates-io]
rustzx-core = { path = "vendor/rustzx-core" }
